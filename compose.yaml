x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-rag}-app:local
  init: true
  restart: unless-stopped

x-runtime: &runtime
  RAG_AMQP_URL: amqp://rag:rag-local@rabbitmq:5672/%2F
  RAG_ARTICLE_STORE: /app/output/web-articles
  RAG_OCR_BACKEND: onnxruntime

x-labels: &labels
  infra.system: rag
  infra.environment: hackathon

services:
  rabbitmq:
    image: rabbitmq:4.2-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rag
      RABBITMQ_DEFAULT_PASS: rag-local
    volumes:
      - rag_queue:/var/lib/rabbitmq
    labels:
      <<: *labels
      infra.service: rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    <<: *app
    build:
      context: .
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-local}
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *runtime
      RAG_PUBLICATION_STORE: /app/output/publications
      RAG_SUBMISSION_CHECKER: /mnt/viniti/tools/check_submission.py
    ports:
      - "${RAG_BIND_IP:-127.0.0.1}:${RAG_BIND_PORT:-4310}:4310"
    volumes:
      - rag_data:/app/output/web-articles
      - rag_publications:/app/output/publications
      - type: bind
        source: ${RAG_CORPUS_DIR:?Set RAG_CORPUS_DIR to the extracted VINITI corpus}
        target: /mnt/viniti
        read_only: true
        bind:
          create_host_path: false
    labels:
      <<: *labels
      infra.service: web
    healthcheck:
      test: [CMD, node, --eval, "fetch('http://127.0.0.1:4310/readyz', {headers: {'X-RAG-Probe': 'compose'}}).then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  worker:
    <<: *app
    command: [python, -m, rag_mvp.article_worker]
    working_dir: /app
    depends_on:
      web:
        condition: service_healthy
    environment:
      <<: *runtime
      RAG_OLLAMA_URL: ${RAG_OLLAMA_URL:-}
    volumes:
      - rag_data:/app/output/web-articles
    labels:
      <<: *labels
      infra.service: worker

volumes:
  rag_data:
  rag_publications:
  rag_queue:
